<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="女優名冊">
    <link rel="apple-touch-icon" href="./img/icon.png">
    
    <title>女優名冊</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght=0,900;1,900&family=Lato:wght=300;400;700;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --amber: #d4a017;
            --serif: 'Playfair Display', serif;
            --sans: 'Lato', sans-serif;
            --safe-top: env(safe-area-inset-top, 44px);
            --safe-bottom: env(safe-area-inset-bottom, 34px);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body, html { 
            margin: 0; padding: 0; 
            height: 100%; width: 100%; 
            background: #fff;
            color: #1a1a1a;
            overflow: hidden; 
            position: fixed;
        }

        .main-container {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            display: flex; 
            overflow-x: auto; 
            overflow-y: hidden;
            scroll-snap-type: x mandatory;
            -webkit-overflow-scrolling: touch;
            background: #fff;
        }

        .page { 
            flex: 0 0 100vw; 
            width: 100vw; 
            height: 100%; 
            position: relative; 
            scroll-snap-align: start; 
            overflow: hidden;
            background-color: #fff;
        }

        /* --- 封面頁 --- */
        .cover-page {
            display: flex; align-items: center; justify-content: center;
            height: 100%; background: #fff;
        }
        .cover-img { width: 100vw; height: auto; max-height: 100%; object-fit: contain; display: block; }

        /* --- 目錄頁 --- */
        .index-page { 
            background: #fff; color: #000; 
            padding: calc(var(--safe-top) + 20px) 25px 0 25px;
            display: flex; flex-direction: column; height: 100%;
        }
        .index-header { font-family: var(--serif); font-size: 3.2rem; border-bottom: 6px solid #000; margin-bottom: 15px; font-weight: 900; }
        
        /* 🔍 搜尋框樣式 */
        .search-box {
            width: 100%;
            padding: 12px 16px;
            font-size: 1rem;
            font-family: var(--sans);
            border: 1px solid #e0e0e0;
            border-radius: 10px;
            margin-bottom: 15px;
            outline: none;
            background: #f9f9f9;
            transition: border-color 0.2s, background-color 0.2s;
        }
        .search-box:focus {
            border-color: #000;
            background: #fff;
        }

        .menu-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; padding-bottom: 120px; }
        .menu-item { padding: 20px; border: 1px solid #f0f0f0; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; font-family: var(--serif); font-size: 1.1rem; cursor: pointer; }

        /* --- 照片頁面 --- */
        .actress-photo-container { 
            width: 100%; height: 100%; 
            overflow-y: auto; scroll-snap-type: y mandatory; 
            background: #fff;
            scrollbar-width: none;
            position: relative;
            z-index: 2;
        }
        .actress-photo-container::-webkit-scrollbar { display: none; }

        .full-img { 
            width: 100vw; 
            height: 100vh;
            object-fit: contain; 
            scroll-snap-align: start; 
            display: block;
            background: #fff;
        }

        /* --- 資訊卡片 --- */
        .info-card {
            position: absolute; 
            bottom: calc(var(--safe-bottom) + 45px);
            left: 20px; right: 20px; 
            background: linear-gradient(to bottom, rgba(0, 0, 0, 0.4) 0%, rgba(0, 0, 0, 0.48) 100%);
            border-radius: 24px; 
            padding: 24px 28px; 
            border: 1px solid rgba(255, 255, 255, 0.2); 
            z-index: 10;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
            pointer-events: none; 
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            border-bottom: 1px solid rgba(255, 255, 255, 0.15);
            padding-bottom: 12px;
            margin-bottom: 18px;
        }

        .card-name { 
            font-family: var(--serif); 
            font-size: 2.2rem; 
            color: #ffffff; 
            margin: 0; 
            font-weight: 900;
            letter-spacing: -0.5px;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.6);
        }
        
        .card-sub { 
            font-family: var(--sans);
            font-size: 0.95rem; 
            color: rgba(255, 255, 255, 0.95); 
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
        }

        .data-grid { 
            display: flex; 
            justify-content: space-between; 
            align-items: center;
        }

        .data-item {
            flex: 1;
            text-align: center;
            position: relative;
        }

        .data-item:not(:last-child)::after {
            content: '';
            position: absolute;
            right: 0;
            top: 20%;
            height: 60%;
            width: 1px;
            background: rgba(255, 255, 255, 0.15);
        }

        .v { 
            font-family: var(--sans); 
            font-weight: 900; 
            color: #ffffff; 
            font-size: 1.65rem; 
            display: block;
            margin-bottom: 2px;
            text-shadow: 0 2px 6px rgba(0, 0, 0, 0.5);
        }
        
        .label { 
            font-family: var(--sans);
            font-size: 0.65rem; 
            color: rgba(255, 255, 255, 0.85); 
            letter-spacing: 2px; 
            text-transform: uppercase; 
            font-weight: 700; 
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.5);
        }

        /* --- 返回按鈕 --- */
        .btn-float-back {
            position: absolute; 
            bottom: calc(var(--safe-bottom) + 0px); 
            right: 25px; 
            width: 50px; height: 50px; 
            background: rgba(255, 255, 255, 0.92); 
            border-radius: 50%; 
            display: flex; 
            flex-direction: column;
            align-items: center; 
            justify-content: center; 
            z-index: 30; 
            border: 1px solid #ffffff;
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.3); 
            transition: transform 0.2s, background-color 0.2s;
            cursor: pointer;
        }
        
        .btn-back-arrow {
            font-size: 1.1rem;
            font-weight: 900;
            color: #1a1a1a;
            line-height: 1;
            margin-top: 2px;
        }

        .btn-back-text {
            font-family: var(--sans);
            font-size: 0.5rem;
            font-weight: 900;
            color: #1a1a1a;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            line-height: 1;
            margin-top: 1px;
        }
        
        .btn-float-back:active { 
            transform: scale(0.9); 
            background: rgba(220, 220, 220, 0.95);
        }
    </style>
</head>
<body>

<div class="main-container" id="mainContainer">
    <div class="page cover-page" id="page-cover">
        <img src="./img/cover.jpg" class="cover-img" alt="Cover">
    </div>

    <div class="page index-page" id="page-index">
        <div class="index-header">CONTENTS</div>
        <input type="text" id="searchInput" class="search-box" placeholder="搜尋女優名字或罩杯 (如: G)..." />
        <div id="menuList" class="menu-list"></div>
    </div>
</div>

<script>
const container = document.getElementById('mainContainer');
const menuList = document.getElementById('menuList');
const indexPage = document.getElementById('page-index');
const searchInput = document.getElementById('searchInput');

// 1. 抽取成 JSON：使用 fetch 動態讀取外部檔
fetch('./actresses.json')
    .then(response => response.json())
    .then(actressData => {
        initApp(actressData);
    })
    .catch(error => console.error('無法載入 actresses.json:', error));

function initApp(actressData) {
    actressData.forEach((item, index) => {
        const actressNum = index + 1;                             
        const actressNumStr = String(actressNum).padStart(2, '0'); 
        
        const page = document.createElement('div');
        page.className = 'page';

        let photosHTML = "";
        for (let i = 1; i <= item.photoCount; i++) {
            // 2. 懶載入：加入 loading="lazy"
            photosHTML += `<img src="./img/${actressNum}-${i}.jpg" class="full-img" loading="lazy">`;
        }

        page.innerHTML = `
            <div class="actress-photo-container">${photosHTML}</div>
            <button class="btn-float-back">
                <span class="btn-back-arrow">➔</span>
                <span class="btn-back-text">Back</span>
            </button>
            <div class="info-card">
                <div class="card-header">
                    <h2 class="card-name">${item.name}</h2>
                    <div class="card-sub">${item.h}cm / ${item.cup}</div>
                </div>
                <div class="data-grid">
                    <div class="data-item"><span class="v">${item.bwh.split('-')[0]}</span><span class="label">Bust</span></div>
                    <div class="data-item"><span class="v">${item.bwh.split('-')[1]}</span><span class="label">Waist</span></div>
                    <div class="data-item"><span class="v">${item.bwh.split('-')[2]}</span><span class="label">Hips</span></div>
                </div>
            </div>
        `;
        container.appendChild(page);

        // 3. 重置照片位置：返回目錄時將 scrollTop 歸零
        page.querySelector('.btn-float-back').onclick = () => {
            page.querySelector('.actress-photo-container').scrollTop = 0;
            indexPage.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'start' });
        };

        const menuLink = document.createElement('div');
        menuLink.className = 'menu-item';
        menuLink.setAttribute('data-name', item.name.toLowerCase());
        menuLink.setAttribute('data-cup', item.cup.toLowerCase());
        menuLink.innerHTML = `<div><span style="color:var(--amber); font-weight:900; margin-right:12px;">${actressNumStr}</span> ${item.name}</div> <span>→</span>`;
        
        menuLink.onclick = () => {
            page.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'start' });
        };
        menuList.appendChild(menuLink);
    });

    // 4. 搜尋與快速篩選功能
    searchInput.addEventListener('input', (e) => {
        const keyword = e.target.value.trim().toLowerCase();
        const menuItems = menuList.querySelectorAll('.menu-item');

        menuItems.forEach(item => {
            const name = item.getAttribute('data-name');
            const cup = item.getAttribute('data-cup');
            
            if (name.includes(keyword) || cup.includes(keyword)) {
                item.style.display = 'flex';
            } else {
                item.style.display = 'none';
            }
        });
    });
}
</script>
</body>
</html>
