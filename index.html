<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>MUSEUM 2026</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght=0,900;1,900&family=Lato:wght=300;400;700;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --amber: #d4a017;
            --serif: 'Playfair Display', serif;
            --sans: 'Lato', sans-serif;
            --safe-top: env(safe-area-inset-top, 44px);
            --safe-bottom: env(safe-area-inset-bottom, 34px);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body, html { 
            margin: 0; padding: 0; 
            height: 100%; width: 100%; 
            background: #fff; /* 還原純白背景，完美契合直式照片兩側 */
            color: #1a1a1a;
            overflow: hidden; 
            position: fixed;
        }

        .main-container {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            display: flex; 
            overflow-x: auto; 
            overflow-y: hidden;
            scroll-snap-type: x mandatory;
            -webkit-overflow-scrolling: touch;
            background: #fff; /* 還原純白背景 */
        }

        .page { 
            flex: 0 0 100vw; 
            width: 100vw; 
            height: 100%; 
            position: relative; 
            scroll-snap-align: start; 
            overflow: hidden;
            background-color: #fff; /* 還原純白背景 */
        }

        /* --- 封面頁 --- */
        .cover-page {
            display: flex; align-items: center; justify-content: center;
            height: 100%; background: #fff;
        }
        .cover-img { width: 100vw; height: auto; max-height: 100%; object-fit: contain; display: block; }

        /* --- 目錄頁 --- */
        .index-page { 
            background: #fff; color: #000; 
            padding: calc(var(--safe-top) + 20px) 25px 0 25px;
            display: flex; flex-direction: column; height: 100%;
        }
        .index-header { font-family: var(--serif); font-size: 3.2rem; border-bottom: 6px solid #000; margin-bottom: 20px; font-weight: 900; }
        .menu-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; padding-bottom: 120px; }
        .menu-item { padding: 20px; border: 1px solid #f0f0f0; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; font-family: var(--serif); font-size: 1.1rem; cursor: pointer; }

        /* --- 照片頁面 --- */
        .actress-photo-container { 
            width: 100%; height: 100%; 
            overflow-y: auto; scroll-snap-type: y mandatory; 
            background: #fff; /* 還原純白背景 */
            scrollbar-width: none;
            position: relative;
            z-index: 2;
        }
        .actress-photo-container::-webkit-scrollbar { display: none; }

        .full-img { 
            width: 100vw; 
            height: 100vh;
            object-fit: contain; 
            scroll-snap-align: start; 
            display: block;
            background: #fff; /* 還原純白背景 */
        }

        /* --- 💎 乾淨高通透卡片（無毛玻璃，黑灰半透明底色） --- */
        .info-card {
            position: absolute; 
            bottom: calc(var(--safe-bottom) + 45px); /* 拉高邊距，避開 iOS 底部黑條 */
            left: 20px; right: 20px; 
            
            /* 保持你最滿意的通透遮罩感 */
            background: linear-gradient(to bottom, rgba(0, 0, 0, 0.4) 0%, rgba(0, 0, 0, 0.48) 100%);
            
            border-radius: 24px; 
            padding: 24px 28px; 
            
            /* 超精細邊框 */
            border: 1px solid rgba(255, 255, 255, 0.2); 
            z-index: 10;
            
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
            pointer-events: none; 
        }

        /* 分隔橫線 */
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            border-bottom: 1px solid rgba(255, 255, 255, 0.15);
            padding-bottom: 12px;
            margin-bottom: 18px;
        }

        /* 名字：純白乾淨無毛邊，後方帶輕微軟陰影襯托 */
        .card-name { 
            font-family: var(--serif); 
            font-size: 2.2rem; 
            color: #ffffff; 
            margin: 0; 
            font-weight: 900;
            letter-spacing: -0.5px;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.6);
        }
        
        /* 身高罩杯 */
        .card-sub { 
            font-family: var(--sans);
            font-size: 0.95rem; 
            color: rgba(255, 255, 255, 0.95); 
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
        }

        .data-grid { 
            display: flex; 
            justify-content: space-between; 
            align-items: center;
        }

        .data-item {
            flex: 1;
            text-align: center;
            position: relative;
        }

        /* 直向分隔線 */
        .data-item:not(:last-child)::after {
            content: '';
            position: absolute;
            right: 0;
            top: 20%;
            height: 60%;
            width: 1px;
            background: rgba(255, 255, 255, 0.15);
        }

        /* 三圍數字 */
        .v { 
            font-family: var(--sans); 
            font-weight: 900; 
            color: #ffffff; 
            font-size: 1.65rem; 
            display: block;
            margin-bottom: 2px;
            text-shadow: 0 2px 6px rgba(0, 0, 0, 0.5);
        }
        
        /* 三圍英文標籤 */
        .label { 
            font-family: var(--sans);
            font-size: 0.65rem; 
            color: rgba(255, 255, 255, 0.85); 
            letter-spacing: 2px; 
            text-transform: uppercase; 
            font-weight: 700; 
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.5);
        }

        /* --- 🔄 精緻 UI 返回按鈕（高亮圓底 + 內嵌黑箭頭與 BACK 標籤） --- */
        .btn-float-back {
            position: absolute; 
            bottom: calc(var(--safe-bottom) + 0px); 
            right: 25px; 
            width: 50px; height: 50px; 
            background: rgba(255, 255, 255, 0.92); 
            border-radius: 50%; 
            
            display: flex; 
            flex-direction: column;
            align-items: center; 
            justify-content: center; 
            z-index: 30; 
            border: 1px solid #ffffff;
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.3); 
            transition: transform 0.2s, background-color 0.2s;
            cursor: pointer;
        }
        
        /* 按鈕內的黑色箭頭 */
        .btn-back-arrow {
            font-size: 1.1rem;
            font-weight: 900;
            color: #1a1a1a;
            line-height: 1;
            margin-top: 2px;
        }

        /* 按鈕內的 BACK 小字 */
        .btn-back-text {
            font-family: var(--sans);
            font-size: 0.5rem;
            font-weight: 900;
            color: #1a1a1a;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            line-height: 1;
            margin-top: 1px;
        }
        
        .btn-float-back:active { 
            transform: scale(0.9); 
            background: rgba(220, 220, 220, 0.95);
        }

    </style>
</head>
<body>

<div class="main-container" id="mainContainer">
    <div class="page cover-page" id="page-cover">
        <img src="./img/cover.jpg" class="cover-img" alt="Cover">
    </div>

    <div class="page index-page" id="page-index">
        <div class="index-header">CONTENTS</div>
        <div id="menuList" class="menu-list"></div>
    </div>
</div>

<script>
const actressData = [
    { name: "瀨戶環奈", h: 170, cup: "J", bwh: "101-59-91", photoCount: 8 },
    { name: "櫻空桃", h: 160, cup: "G", bwh: "90-55-86", photoCount: 9 },
    { name: "三田真鈴", h: 157, cup: "F", bwh: "77-55-89", photoCount: 4 },
    { name: "涼森玲夢", h: 160, cup: "F", bwh: "87-58-85", photoCount: 4 },
    { name: "石川澪", h: 158, cup: "B", bwh: "78-56-85", photoCount: 4 },
    { name: "鷲尾芽衣", h: 165, cup: "J", bwh: "104-59-89", photoCount: 3 },
    { name: "村上悠華", h: 163, cup: "E", bwh: "85-59-88", photoCount: 4 },
    { name: "五日市芽依", h: 161, cup: "G", bwh: "88-59-89", photoCount: 4 },
    { name: "miru", h: 157, cup: "E", bwh: "82-54-84", photoCount: 4 },
    { name: "七嶋 舞", h: 160, cup: "D", bwh: "84-58-85", photoCount: 4 },
    { name: "長浜蜜璃", h: 161, cup: "G", bwh: "90-58-90", photoCount: 4 },
    { name: "三佳詩", h: 165, cup: "F", bwh: "85-55-87", photoCount: 4 },
    { name: "福田悠亞", h: 162, cup: "H", bwh: "90-55-90", photoCount: 4 },
    { name: "西宮夢", h: 158, cup: "D", bwh: "85-56-86", photoCount: 4 },
    { name: "彩月七緒", h: 164, cup: "H", bwh: "92-59-84", photoCount: 4 },
    { name: "凪ひかる", h: 162, cup: "K", bwh: "105-58-88", photoCount: 4 },
    { name: "小宵こなん", h: 164, cup: "H", bwh: "96-59-94", photoCount: 4 },
    { name: "白上咲花", h: 168, cup: "C", bwh: "83-57-89", photoCount: 4 },
    { name: "百田光稀", h: 166, cup: "J", bwh: "100-57-89", photoCount: 4 },
    { name: "九野ひなの", h: 157, cup: "G", bwh: "90-60-88", photoCount: 4 },
    { name: "河合あすな", h: 158, cup: "H", bwh: "88-59-89", photoCount: 4 },
    { name: "桃乃木かな", h: 153, cup: "F", bwh: "89-58-83", photoCount: 4 },
    { name: "夢乃愛華", h: 148, cup: "G", bwh: "79-52-78", photoCount: 4 },
    { name: "河北彩花", h: 169, cup: "E", bwh: "87-57-86", photoCount: 4 },
    { name: "庵姬花", h: 153, cup: "L", bwh: "100-57-89", photoCount: 6 },
    { name: "本鄉愛", h: 158, cup: "F", bwh: "85-53-85", photoCount: 4 },
    { name: "新有菜", h: 167, cup: "B", bwh: "84-58-84", photoCount: 4 },
    { name: "小野六花", h: 148, cup: "C", bwh: "81-58-82", photoCount: 4 },
    { name: "Eva Elfie", h: 163, cup: "C", bwh: "86-60-88", photoCount: 8 }
];

const container = document.getElementById('mainContainer');
const menuList = document.getElementById('menuList');
const indexPage = document.getElementById('page-index');

actressData.forEach((item, index) => {
    const actressNum = index + 1;                             
    const actressNumStr = String(actressNum).padStart(2, '0'); 
    
    const page = document.createElement('div');
    page.className = 'page';

    let photosHTML = "";
    for (let i = 1; i <= item.photoCount; i++) {
        photosHTML += `<img src="./img/${actressNum}-${i}.jpg" class="full-img">`;
    }

    page.innerHTML = `
        <div class="actress-photo-container">${photosHTML}</div>
        <button class="btn-float-back">
            <span class="btn-back-arrow">➔</span>
            <span class="btn-back-text">Back</span>
        </button>
        <div class="info-card">
            <div class="card-header">
                <h2 class="card-name">${item.name}</h2>
                <div class="card-sub">${item.h}cm / ${item.cup}</div>
            </div>
            <div class="data-grid">
                <div class="data-item"><span class="v">${item.bwh.split('-')[0]}</span><span class="label">Bust</span></div>
                <div class="data-item"><span class="v">${item.bwh.split('-')[1]}</span><span class="label">Waist</span></div>
                <div class="data-item"><span class="v">${item.bwh.split('-')[2]}</span><span class="label">Hips</span></div>
            </div>
        </div>
    `;
    container.appendChild(page);

    page.querySelector('.btn-float-back').onclick = () => {
        indexPage.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'start' });
    };

    const menuLink = document.createElement('div');
    menuLink.className = 'menu-item';
    menuLink.innerHTML = `<div><span style="color:var(--amber); font-weight:900; margin-right:12px;">${actressNumStr}</span> ${item.name}</div> <span>→</span>`;
    
    menuLink.onclick = () => {
        page.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'start' });
    };
    menuList.appendChild(menuLink);
});
</script>
</body>
</html>
