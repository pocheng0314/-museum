name: Clean All Images by Prefix
on:
  workflow_dispatch:
    inputs:
      prefix:
        description: '要刪除的檔名開頭 (例如 54- 或 46-)'
        required: true
permissions:
  contents: write
jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          find . -type f \( -name "${{ github.event.inputs.prefix }}*.jpg" -o -name "${{ github.event.inputs.prefix }}*.png" -o -name "${{ github.event.inputs.prefix }}*.jpeg" \) -delete
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Remove images starting with ${{ github.event.inputs.prefix }} across repository" || exit 0
          git push
